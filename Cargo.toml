[package]
name = "zapret-rs"
version = "1.0.0"
edition = "2024"

[[bin]]
name = "nfqws2"
path = "src/bin/nfqws2.rs"

[[bin]]
name = "ip2net"
path = "src/bin/ip2net.rs"

[[bin]]
name = "mdig"
path = "src/bin/mdig.rs"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
libc = "0.2.191"
mlua = { version = "0.12.3", features = ["luajit", "vendored"] }
nfq = "0.2.6"
rand = "0.9.5"
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.2"
