[package]
name = "zapret-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nfqws2"
path = "src/bin/nfqws2.rs"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
libc = "0.2.191"
mlua = { version = "0.12.3", features = ["luajit", "vendored"] }
nfq = "0.2.6"
rand = "0.9.5"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.2"
