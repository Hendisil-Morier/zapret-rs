name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Check headless build
        run: cargo check --no-default-features
      - name: Run tests
        run: cargo nextest run --show-progress none --no-pager

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          cache-on-failure: true
      - name: Check Windows build
        run: cargo check --all-targets

  release-windows:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - name: Cache WinDivert archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/WinDivert-2.2.2-A.zip
          key: windivert-2.2.2-A
      - name: Build release binary
        run: cargo build --release
      - name: Package Windows release with WinDivert
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $stage = "dist"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/release/zapret-rs.exe" "$stage/zapret-rs.exe"
          Copy-Item "README.md" "$stage/README.md"
          Copy-Item "CHANGELOG.md" "$stage/CHANGELOG.md"
          Copy-Item -Recurse "lua" "$stage/lua"

          $wdZip = "$env:TEMP/WinDivert-2.2.2-A.zip"
          $wdDir = "$env:TEMP/WinDivert-2.2.2-A"
          if (-not (Test-Path $wdZip)) {
            Invoke-WebRequest -Uri "https://reqrypt.org/download/WinDivert-2.2.2-A.zip" -OutFile $wdZip
          }
          Expand-Archive -Path $wdZip -DestinationPath $env:TEMP -Force
          Copy-Item "$wdDir/x64/WinDivert.dll" "$stage/WinDivert.dll"
          Copy-Item "$wdDir/x64/WinDivert64.sys" "$stage/WinDivert64.sys"
          Copy-Item "$wdDir/LICENSE" "$stage/WinDivert-LICENSE.txt"

          $archive = "zapret-rs-$tag-windows-x86_64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
      - name: Upload Windows release archive
        uses: softprops/action-gh-release@v2
        with:
          files: zapret-rs-${{ github.ref_name }}-windows-x86_64.zip

  release-linux:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux
      - name: Build release binary
        run: cargo build --release
      - name: Package Linux release archive
        run: |
          tag="${{ github.ref_name }}"
          stage="dist"
          mkdir -p "$stage"
          cp target/release/zapret-rs "$stage/zapret-rs"
          cp README.md CHANGELOG.md "$stage/"
          cp -r lua "$stage/lua"
          cp -r contrib "$stage/contrib"
          tar -czf "zapret-rs-${tag}-linux-x86_64.tar.gz" -C "$stage" .
      - name: Upload Linux release archive
        uses: softprops/action-gh-release@v2
        with:
          files: zapret-rs-${{ github.ref_name }}-linux-x86_64.tar.gz
          generate_release_notes: true
